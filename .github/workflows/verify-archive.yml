name: Verify archive.org copies

# Checks that the files in data/mapping are on archive.org with the uploaded size and stamps them
# with verified_at. Run it some time after archive-bpk: archive.org takes minutes to hours to
# show an upload. Files not there yet stay unstamped and are checked again next time.
on:
  workflow_dispatch:
    inputs:
      jenis:
        description: "Type of regulation (empty = all)"
        default: ""
      delete_missing:
        description: "Delete the mappings of regulations with a missing or mismatched PDF, so archive-bpk uploads them again"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: verify-archive
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: Verify
        env:
          JENIS: ${{ inputs.jenis }}
          DELETE: ${{ inputs.delete_missing && '--delete-missing' || '' }}
        run: |
          set -o pipefail
          uv run verify-mapping "$JENIS" $DELETE | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Commit stamps
        if: always()   # keep the stamps of what passed even when something is still missing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # deletions first, in their own commit: archive-bpk picks those regulations up again
          committed=no
          git ls-files --deleted -z -- data/mapping | xargs -0 -r git rm --cached -q --
          if ! git diff --cached --quiet; then
            git commit -qm "chore(mapping): delete copies to upload again"
            committed=yes
          fi
          git add data/mapping
          if ! git diff --cached --quiet; then
            git commit -qm "chore(mapping): verify archive.org copies"
            committed=yes
          fi
          if [ "$committed" = yes ]; then
            for i in 1 2 3 4 5; do
              git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q && break
              sleep $((i * 20))
            done
          fi
