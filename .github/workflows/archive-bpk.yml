name: Archive BPK PDFs

# Downloads regulation PDFs from peraturan.bpk.go.id, uploads them to archive.org and commits
# the mapping (BPK url -> archive.org url) to data/mapping/<jenis>/<id>.yaml. Ids follow
# <jenis>_<nomor>_<tahun> (uu_4_2009). Regulations already mapped are skipped, so runs resume.
# A run is stopped at 6 h (GitHub's limit for a job); this one stops starting new regulations
# after 5 h 25 min, commits, and starts the next run itself while work is left.
on:
  workflow_dispatch:
    inputs:
      jenis:
        description: "Type of regulation"
        type: choice
        default: uu
        options: [uu, perppu, pp, perpres]
      limit:
        description: "Max regulations to upload (0 = until all done; runs chain by themselves)"
        default: "0"
      only:
        description: "Just these ids, comma-separated (e.g. uu_4_2009,uu_31_1999)"
        default: ""

permissions:
  contents: write
  actions: write # to start the next run when this one ends with work left

concurrency:
  group: archive-bpk
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: dhantyo/hukum-bersih
          path: hukum-bersih
      - uses: astral-sh/setup-uv@v7
      - name: Install (stealth browser for Cloudflare)
        run: |
          sudo apt-get install -y -qq xvfb >/dev/null
          cd hukum-bersih/pipeline && uv sync --extra bpk && uv run scrapling install
      - name: Download, upload, map
        id: archive
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
          HUKUM_BERSIH_BPK_STATE: ${{ runner.temp }}/bpk-state.json
          JENIS: ${{ inputs.jenis }}
          LIMIT: ${{ inputs.limit }}
          ONLY: ${{ inputs.only }}
        run: |
          xvfb-run -a uv run --project hukum-bersih/pipeline --extra bpk --with internetarchive \
            python scripts/archive_bpk.py "$JENIS" --limit "$LIMIT" --budget-minutes 325 --only "$ONLY" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Commit mapping
        if: always()   # keep what was uploaded even when the run failed or timed out
        env:
          JENIS: ${{ inputs.jenis }}
          LIMIT: ${{ inputs.limit }}
          ONLY: ${{ inputs.only }}
          LEFT: ${{ steps.archive.outputs.left }}
          UPLOADED: ${{ steps.archive.outputs.uploaded }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mapping
          if ! git diff --cached --quiet; then
            git commit -qm "mapping/$JENIS: archive.org copies of BPK PDFs"
            for i in 1 2 3 4 5; do
              git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q && break
              sleep $((i * 20))
            done
          fi
          # Out of time with work left, and this run got something done (not stuck on errors):
          # start the next run with the same inputs.
          if [ "$LEFT" = yes ] && [ "${UPLOADED:-0}" -gt 0 ] && [ -z "$ONLY" ]; then
            echo "Time is up with work left: starting the next run" | tee -a "$GITHUB_STEP_SUMMARY"
            gh workflow run archive-bpk.yml --ref "$GITHUB_REF_NAME" -f jenis="$JENIS" -f limit="$LIMIT"
          fi
